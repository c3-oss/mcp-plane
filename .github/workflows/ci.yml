name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter reads the PR file list through the REST API.
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # The default 'some' quantifier matches a file against any single
          # pattern, which makes '**' swallow the negations below.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Go modules and build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.17.4

      - name: Install Node tooling
        run: devbox run -- pnpm install --frozen-lockfile

      - name: Lint commit messages
        id: commitlint
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: devbox run -- pnpm exec commitlint --config commitlint.config.cjs --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Run quality gates
        id: quality
        continue-on-error: true
        env:
          # Lychee falls back to anonymous GitHub requests without this, and
          # private c3-oss repos return 404 to anonymous lookups.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devbox run -- just quality

      - name: Tidy check
        id: tidy-check
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: devbox run -- just tidy-check

      - name: Vet
        id: vet
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: devbox run -- just vet

      - name: Run golangci-lint
        id: lint
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: devbox run -- just lint

      - name: Static security analysis (gosec)
        id: lint-sec
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: devbox run -- just lint-sec

      - name: Vulnerability scan (govulncheck)
        id: lint-vuln
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: devbox run -- just lint-vuln

      - name: Test
        id: test
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: devbox run -- go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        id: coverage
        if: always() && needs.changes.outputs.code == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Build
        id: build
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: devbox run -- just build

      # Saved explicitly rather than through actions/cache@v6, whose post step
      # is post-if: success() and would be skipped whenever the aggregator
      # below fails the job. The primary key is immutable once written, so the
      # save only runs when a step that actually populates the cache completed.
      - name: Save Go modules and build cache
        if: >-
          always() && !cancelled() &&
          steps.go-cache.outcome == 'success' &&
          steps.go-cache.outputs.cache-hit != 'true' &&
          (steps.test.outcome == 'success' || steps.build.outcome == 'success')
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Aggregate check results
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          failed=$(printf '%s' "$STEPS" | jq -r '
            to_entries[]
            | select([.value.outcome, .value.conclusion]
                     | any(. == "failure" or . == "cancelled"))
            | .key')
          if [ -n "$failed" ]; then
            printf 'failed checks:\n%s\n' "$failed"
            printf '%s\n' "$failed" | while read -r s; do echo "::error::check failed: $s"; done
            exit 1
          fi
          echo "all checks passed"

  build-macos:
    name: build / macos-latest
    runs-on: macos-latest
    needs: changes
    # github.event.pull_request is absent on push, so the dependabot guard is
    # gated on the event type too.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.17.4

      - name: Build
        run: devbox run -- just build
